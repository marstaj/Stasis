name: Release

on:
  push:
    # Release versions only: the app's update check cannot parse a pre-release tag.
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write
  # For the build provenance attestation: an OIDC token to sign it, and the API to store it.
  id-token: write
  attestations: write

jobs:
  release:
    # Needs Xcode 26+ for the Icon Composer icon; this image defaults to it.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - run: make test
      - run: make release VERSION="${GITHUB_REF_NAME#v}"
      # Before the release exists, so a published zip always has its attestation.
      - uses: actions/attest@v4
        with:
          subject-path: build/Stasis.zip
      - run: gh release create "$GITHUB_REF_NAME" build/Stasis.zip --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
